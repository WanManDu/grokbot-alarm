<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Referrer-Policy" content="no-referrer">
<title>Connect</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #000; color: #fff; font-family: "Avenir Next", "Segoe UI", sans-serif; }
  main { min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; gap: 20px; }
  h1 { font-size: 40px; font-weight: 900; letter-spacing: -0.04em; margin: 0; }
  p { color: #8b98a5; font-size: 16px; margin: 0; }
  a.btn { display: block; background: #fff; color: #000; text-align: center; text-decoration: none; font-weight: 700; font-size: 18px; border-radius: 16px; padding: 18px; }
  a.quiet { color: #8b98a5; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Connect</h1>
  <p id="status"></p>
  <a id="open" class="btn" href="#" rel="noreferrer">Open app</a>
  <a class="quiet" href="https://github.com/WanManDu/grokbot-alarm#app-install" rel="noreferrer">Install</a>
</main>
<script>
(function () {
  var fragment = location.hash.charAt(0) === "#" ? location.hash.slice(1) : "";
  if (window.history && history.replaceState) {
    history.replaceState(null, "", location.pathname);
  }
  var params = new URLSearchParams(fragment);
  var secret = params.get("s") || "";
  var server = (params.get("srv") || "").replace(/\/+$/, "");
  var name = ((params.get("n") || "AI").replace(/\s+/g, " ").trim() || "AI").slice(0, 40);
  var title = document.getElementById("title");
  var status = document.getElementById("status");
  var open = document.getElementById("open");
  var secretOk = /^[A-Za-z0-9_-]{16,40}$/.test(secret);
  var loopback = /^http:\/\/(127\.0\.0\.1|localhost|\[::1\])(?::[0-9]+)?$/.test(server);
  var serverOk = (/^https:\/\/\S+$/.test(server) || loopback) && server.indexOf(" ") === -1 && server.indexOf("@") === -1;
  if (!secretOk || !serverOk) {
    status.textContent = "This link is missing the pairing data.";
    open.style.display = "none";
    return;
  }
  title.textContent = "Connect " + name + "?";
  var q = "s=" + encodeURIComponent(secret)
    + "&srv=" + encodeURIComponent(server)
    + "&n=" + encodeURIComponent(name);
  // package= locks this to our app. A bare grokbot-alarm:// URL is not used;
  // another app can register that scheme and take the secret.
  var intent = "intent://pair?" + q + "#Intent;scheme=grokbot-alarm;package=works.gauss.grokbotalarm;end";
  open.href = intent;
  open.rel = "noreferrer";
  window.location.href = intent;
})();
</script>
</body>
</html>
