name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: CLI tests
        run: python3 -m unittest cli/test_grokbot_alarm.py

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d /tmp
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0" "platform-tools"

      - name: Unit tests
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Label the debug artifact
        run: |
          set -euo pipefail
          src=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$src" grokbot-alarm-debug.apk
          printf '%s\n' \
            'This is a DEBUG build.' \
            'It is debuggable and signed with the public debug keystore (android/debug.keystore).' \
            'It is not a release build. A release APK is produced only when the' \
            'ANDROID_KEYSTORE_* Actions secrets are configured. See README, Release signing.' \
            > BUILD.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grokbot-alarm-debug
          path: |
            grokbot-alarm-debug.apk
            BUILD.txt
          if-no-files-found: error

      - name: Release keystore, if the owner has added it
        id: releasekey
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore secrets. CI built the debug APK only and labeled it as a debug build. This is not a release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.releasekey.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Reject a debuggable or debug-signed release
        if: steps.releasekey.outputs.present == 'true'
        run: |
          set -euo pipefail
          src=$(find android/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          test -n "$src"
          SDK="${ANDROID_HOME}"
          AAPT=$(find "$SDK/build-tools" -name aapt -type f | sort | tail -1)
          "$AAPT" dump xmltree "$src" AndroidManifest.xml > /tmp/manifest.txt
          if grep -E 'debuggable.*0xffffffff' /tmp/manifest.txt; then
            echo "release APK is debuggable" >&2
            exit 1
          fi
          # Debug keystore fingerprint. A release APK must not match it.
          DEBUG_FP="EF:36:26:2F:00:B4:CB:41:CE:0E:D2:AA:16:17:AE:A0:40:3E:0E:E3:8B:E4:0F:E3:E2:60:7F:73:A0:15:21:B4"
          keytool -printcert -jarfile "$src" > /tmp/cert.txt
          if grep -q "$DEBUG_FP" /tmp/cert.txt; then
            echo "release APK is signed with the debug key" >&2
            exit 1
          fi
          cp "$src" grokbot-alarm-release.apk
          cat > RELEASE.txt << 'EOF'
          This is a release build. It is minified and not debuggable.
          It is signed with the release key from Actions secrets, not android/debug.keystore.
          EOF

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.releasekey.outputs.present == 'true'
        with:
          name: grokbot-alarm-release
          path: |
            grokbot-alarm-release.apk
            RELEASE.txt
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: grokbot-alarm-debug
          path: dist

      - name: Download release APK if this tag built one
        id: rel
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: grokbot-alarm-release
          path: dist

      - name: Note when the tag only has a debug APK
        if: steps.rel.outcome != 'success'
        run: |
          echo "This tag has no release keystore, so the attached APK is the debug build described in BUILD.txt. It is not a release build." >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            If `grokbot-alarm-release.apk` is attached, that is the minified non-debuggable build.
            `grokbot-alarm-debug.apk` is always a debug build signed with the public debug key.
            When the release keystore secrets are absent, only the debug APK is attached. That is not a release build.
